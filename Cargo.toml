[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stefanobaldo/seedstone"
homepage = "https://github.com/stefanobaldo/seedstone"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.lints.clippy]
# `priority = -1` so the item-level entries below win over the group.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
disallowed_methods = "deny"
disallowed_types = "deny"

[workspace.dependencies]
# The workspace's own crates, with a version beside the path: crates.io
# ignores the path and needs the version, and `=` keeps the four published
# crates of one release pointing at each other and at nothing else.
seedstone-core = { path = "crates/seedstone-core", version = "=0.3.2" }
seedstone-resp = { path = "crates/seedstone-resp", version = "=0.3.2" }
seedstone-service = { path = "crates/seedstone-service", version = "=0.3.2" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
turmoil = "=0.7.2"
siphasher = "1"
getrandom = "0.4"
rand = { version = "0.10", features = ["chacha"] }
bytes = "1"
