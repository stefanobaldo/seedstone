apiVersion: v1
kind: Service
metadata:
  name: {{ include "seedstone.fullname" . }}
  labels: {{- include "seedstone.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: resp
      port: {{ .Values.service.port }}
      targetPort: resp
  selector: {{- include "seedstone.selector" . | nindent 4 }}
