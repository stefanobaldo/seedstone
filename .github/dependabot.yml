# Pinning the actions in `ci.yml` to commit SHAs is only half the job: a pin
# with no update channel is how a workflow ends up years behind on a dependency
# nobody remembers is there. This is the other half.
#
# Scoped to `github-actions` on purpose. Cargo dependencies are deliberately
# left out for now — `turmoil` is pinned to an exact version precisely so that
# a simulator upgrade is a deliberate act, since trace stability across
# simulator versions is not guaranteed. Opening an automated channel on it
# works against that. Revisit once a baseline benchmark exists to tell whether
# a bump regressed anything.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
