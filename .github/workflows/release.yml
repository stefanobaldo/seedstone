name: Release

# A tag is what publishes; the manual trigger exists so the build and the
# packaging can be proved on a runner without publishing anything — it
# uploads what it built as workflow artifacts and stops there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; each job that publishes asks for what it needs.
permissions:
  contents: read

jobs:
  # One place the version is computed, so the jobs cannot disagree about it,
  # and the one place a tag is refused: every other job needs this one.
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      final: ${{ steps.v.outputs.final }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The binary reports its version in `INFO` and `HELLO`, so a tag that
      # disagrees with the workspace would publish an archive and an image
      # that lie about themselves. First, before any build: the check is
      # cheap and a tag is not movable once pushed.
      - name: the tag and the workspace agree
        if: github.event_name == 'push'
        run: bash scripts/set-version.sh --check "${GITHUB_REF_NAME#v}"
      - id: v
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            version="${GITHUB_REF_NAME#v}"; publish=true
            case "$GITHUB_REF_NAME" in *-*) final=false;; *) final=true;; esac
          else
            version="dispatch-${GITHUB_SHA::8}"; publish=false; final=false
          fi
          printf 'version=%s\npublish=%s\nfinal=%s\n' "$version" "$publish" "$final" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15,         target: aarch64-apple-darwin }
          # Built on the Apple silicon runner with `--target`; the packaging
          # smoke runs the binary under Rosetta, which the runner image
          # carries — no install step, and no Intel runner, is needed.
          - { os: macos-15,         target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Pinned by SHA for the reason `ci.yml` states: a tag is a name its
      # owner may move, and a release is the last place to accept that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: the cross target's toolchain
        if: matrix.cross
        run: rustup target add ${{ matrix.target }}
      # `--locked` so what is published is built from the lockfile that was
      # tested, not from whatever resolved on the day.
      - name: build
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cargo build --release -p seedstone --locked --target ${{ matrix.target }}
            echo "BIN=target/${{ matrix.target }}/release/seedstone" >> "$GITHUB_ENV"
          else
            cargo build --release -p seedstone --locked
            echo "BIN=target/release/seedstone" >> "$GITHUB_ENV"
          fi
      # The archive is named after its target, and refused unless that is
      # what it contains: the triple a native build was compiled for is read
      # from the compiler, and the binary's own architecture from the file
      # (`-b`, so the path, which names the target, is not what matches). The
      # day a runner label moves, the archive fails instead of being
      # mislabelled.
      - name: the binary is for the target it is named after
        run: |
          if [ "${{ matrix.cross }}" != true ]; then
            host="$(rustc -vV | sed -n 's/^host: //p')"
            [ "$host" = "${{ matrix.target }}" ] || { echo "the runner compiles for $host, not ${{ matrix.target }}" >&2; exit 1; }
          fi
          case "${{ matrix.target }}" in
            x86_64-*)  want='x86_64|x86-64' ;;
            aarch64-*) want='aarch64|arm64' ;;
          esac
          file -b "$BIN" | grep -E -q "$want" || { echo "$(file "$BIN") is not ${{ matrix.target }}" >&2; exit 1; }
      - name: package
        run: bash scripts/package-release.sh "$BIN" "${{ needs.meta.outputs.version }}" "${{ matrix.target }}" dist
      # The Debian and RPM packages, from the binary this job just built,
      # with their checksums beside the archive's. They carry the workspace
      # version, not the archive's name: on a dispatch, that is the version
      # being rehearsed.
      - name: deb and rpm
        if: runner.os == 'Linux'
        run: bash scripts/linux-packages.sh dist
      # The Homebrew formula, rendered from placeholder checksums, on the one
      # leg that has Homebrew. Under a `Formula/` directory, because that is
      # what makes `brew style` apply its formula rules; anywhere else it
      # lints the file as plain Ruby.
      - name: the formula passes brew style
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          d="$RUNNER_TEMP/formula"; mkdir -p "$d/Formula"
          for t in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            printf '%064d  seedstone-0.0.0-%s.tar.gz\n' 0 "$t" > "$d/seedstone-0.0.0-$t.tar.gz.sha256"
          done
          bash scripts/render-formula.sh 0.0.0 "$d" > "$d/Formula/seedstone.rb"
          brew style "$d/Formula/seedstone.rb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The GitHub Release, carrying every archive and checksum the matrix built.
  # Its notes are the changelog's section for this version; a candidate has
  # none of its own and falls back to `[Unreleased]`, as `docs/RELEASING.md`
  # says. It waits for the images too: a release whose image failed its
  # smoke is not published under a tag that cannot be moved.
  publish:
    needs: [meta, build, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: every archive has its checksum, and the checksums verify
        run: |
          cd dist && ls -l
          for a in *.tar.gz; do [ -f "$a.sha256" ] || { echo "$a has no checksum" >&2; exit 1; }; done
          sha256sum -c -- *.sha256
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          section() {
            awk -v want="## [$1]" 'index($0, want) == 1 { inside = 1; next }
                                   inside && /^## \[/ { exit }
                                   inside { print }' CHANGELOG.md
          }
          section "${GITHUB_REF_NAME#v}" > notes.md
          [ -s notes.md ] || section Unreleased > notes.md
          prerelease=""
          [ "${{ needs.meta.outputs.final }}" = true ] || prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease

  # The four crates, by trusted publishing: the job's OIDC token is
  # exchanged for a short-lived crates.io token, so no secret is stored.
  # `--workspace` publishes in dependency order and skips the simulator.
  # After the release, because a crate version cannot be taken back (only
  # yanked, and its number is spent), and because `cargo binstall` resolves
  # the release's archives: a crate goes up only once everything it points
  # at exists. Finals only: a candidate is for testing, from the GitHub
  # Release and GHCR, and a crate version it spent would stay on crates.io
  # for good.
  crates:
    needs: [meta, publish]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.final == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # The formula, rendered from this release's checksums and pushed to the
  # tap; then installed from the tap on this runner and smoked. Finals
  # only: a candidate on the tap would reach everyone's `brew upgrade`. The
  # install check runs after the push on purpose — the tap is mutable, and
  # a bad formula is corrected by the next commit, unlike a tag.
  homebrew:
    needs: [meta, build, publish]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.final == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    # Two finals' jobs never push at once; the second waits for the first.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Under a `Formula/` directory, so `brew style` applies its formula
      # rules rather than linting the file as plain Ruby.
      - name: render
        run: |
          mkdir -p formula/Formula
          bash scripts/render-formula.sh "${{ needs.meta.outputs.version }}" dist > formula/Formula/seedstone.rb
          brew style formula/Formula/seedstone.rb
      # A re-run that renders the formula already on the tap commits nothing
      # and pushes nothing, rather than failing on an empty commit. A re-run
      # of an older final, once a newer one is on the tap, leaves the tap
      # alone: it would otherwise move everyone back a version.
      - name: push to the tap
        id: tap
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          [ -n "$KEY" ] || { echo "the secret HOMEBREW_TAP_DEPLOY_KEY is not set" >&2; exit 1; }
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          git clone --quiet git@github.com:seedstonelabs/homebrew-tap.git tap
          current="$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Formula/seedstone.rb 2>/dev/null || true)"
          if [ -n "$current" ] && [ "$current" != "$VERSION" ] &&
             [ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)" = "$current" ]; then
            echo "the tap already carries $current, newer than $VERSION; left as it is"
            echo "newer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p tap/Formula && cp formula/Formula/seedstone.rb tap/Formula/seedstone.rb
          cd tap
          git add Formula/seedstone.rb
          if git diff --cached --quiet; then
            echo "the tap already carries this formula"
          else
            git -c user.name='seedstone release' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit --quiet -m "seedstone ${{ needs.meta.outputs.version }}"
            git push --quiet
          fi
      - name: install from the tap
        if: steps.tap.outputs.newer != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install seedstonelabs/tap/seedstone
          reported="$(seedstone --version)"
          [ "$reported" = "seedstone ${{ needs.meta.outputs.version }}" ] || { echo "the tap installed $reported" >&2; exit 1; }
          brew test seedstonelabs/tap/seedstone

  # One image per architecture, built natively on its runner (no emulation:
  # an emulated build is slow and is not what a user runs), smoked before
  # anything leaves the runner, pushed by digest, then joined into one index
  # under the tag. A dispatch builds and smokes and pushes nothing.
  image:
    needs: meta
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04,     arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and smoke
        run: |
          docker buildx build --load --platform linux/${{ matrix.arch }} -t seedstone-smoke .
          reported="$(docker run --rm seedstone-smoke --version)"
          case "$reported" in 'seedstone '?*) ;; *) echo "the image does not report its version: $reported" >&2; exit 1;; esac
      # The digest travels to the join as a file rather than a job output: a
      # matrix job has one set of outputs for all its legs.
      - name: push by digest
        if: needs.meta.outputs.publish == 'true'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/${{ matrix.arch }} \
            --output type=image,name=ghcr.io/stefanobaldo/seedstone,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file meta.json .
          mkdir digest
          jq -r '."containerimage.digest"' meta.json > digest/${{ matrix.arch }}
          grep -q '^sha256:' digest/${{ matrix.arch }} || { echo "no digest in meta.json" >&2; cat meta.json >&2; exit 1; }
      - if: needs.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest/*
          if-no-files-found: error

  # The join: one index under the tag, on GHCR (canonical) and on Docker Hub
  # (the mirror: the same index, a shorter name). The digest to record in a
  # deployment is the index's, printed by the GHCR step. After the release,
  # so a tag and `latest` name an image only once the release exists.
  image-index:
    needs: [meta, image, publish]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true
      - name: the index on GHCR
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo=ghcr.io/stefanobaldo/seedstone
          tags="-t $repo:${GITHUB_REF_NAME}"
          [ "${{ needs.meta.outputs.final }}" = true ] && tags="$tags -t $repo:latest"
          docker buildx imagetools create $tags "$repo@$(cat digest/amd64)" "$repo@$(cat digest/arm64)"
          docker buildx imagetools inspect "$repo:${GITHUB_REF_NAME}"
      # The mirror comes last and after the release has what it needs: a
      # Docker Hub token that expired fails this step visibly, not the release.
      # Finals only: a candidate is tested from GHCR, and the mirror is where
      # people who are not testing anything pull from.
      - name: the mirror on Docker Hub
        if: needs.meta.outputs.final == 'true'
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$NS" ] || { echo "the repository variable DOCKERHUB_NAMESPACE is not set" >&2; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          src=ghcr.io/stefanobaldo/seedstone:${GITHUB_REF_NAME}
          tags="-t docker.io/$NS/seedstone:${GITHUB_REF_NAME} -t docker.io/$NS/seedstone:latest"
          docker buildx imagetools create $tags "$src"
          docker buildx imagetools inspect "docker.io/$NS/seedstone:${GITHUB_REF_NAME}"

  # The chart, versioned with the tag and pushed as an OCI artifact beside
  # the image. `helm install` without --version picks the newest final; a
  # candidate is reachable with --devel or by version. A candidate pushes it
  # as it pushes the image, to GHCR and nowhere else. After the index, so a
  # chart never names an image tag that does not exist yet.
  chart:
    needs: [meta, image-index]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: package and push
        run: |
          v="${{ needs.meta.outputs.version }}"
          helm version
          helm package charts/seedstone --version "$v" --app-version "$v" --destination out
          echo "${{ github.token }}" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "out/seedstone-$v.tgz" oci://ghcr.io/stefanobaldo/charts
          helm show chart oci://ghcr.io/stefanobaldo/charts/seedstone --version "$v"
