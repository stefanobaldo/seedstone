name: Release

# A tag is what publishes; the manual trigger exists so the build and the
# packaging can be proved on a runner without publishing anything — it
# uploads what it built as workflow artifacts and stops there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; each job that publishes asks for what it needs.
permissions:
  contents: read

jobs:
  # One place the version is computed, so the jobs cannot disagree about it.
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      final: ${{ steps.v.outputs.final }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            version="${GITHUB_REF_NAME#v}"; publish=true
            case "$GITHUB_REF_NAME" in *-*) final=false;; *) final=true;; esac
          else
            version="dispatch-${GITHUB_SHA::8}"; publish=false; final=false
          fi
          printf 'version=%s\npublish=%s\nfinal=%s\n' "$version" "$publish" "$final" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15,         target: aarch64-apple-darwin }
          # Built on the Apple silicon runner with `--target`; the packaging
          # smoke runs the binary under Rosetta, which the runner image
          # carries — no install step, and no Intel runner, is needed.
          - { os: macos-15,         target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Pinned by SHA for the reason `ci.yml` states: a tag is a name its
      # owner may move, and a release is the last place to accept that.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # The binary reports its version in `INFO` and `HELLO`, so a tag that
      # disagrees with the workspace would publish an archive that lies about
      # itself. Before the build, not after: the check is cheap and a tag is
      # not movable once pushed.
      - name: the tag and the workspace agree
        if: github.event_name == 'push'
        run: bash scripts/set-version.sh --check "${GITHUB_REF_NAME#v}"
      - name: the cross target's toolchain
        if: matrix.cross
        run: rustup target add ${{ matrix.target }}
      # `--locked` so what is published is built from the lockfile that was
      # tested, not from whatever resolved on the day.
      - name: build
        run: |
          if [ "${{ matrix.cross }}" = true ]; then
            cargo build --release -p seedstone --locked --target ${{ matrix.target }}
            echo "BIN=target/${{ matrix.target }}/release/seedstone" >> "$GITHUB_ENV"
          else
            cargo build --release -p seedstone --locked
            echo "BIN=target/release/seedstone" >> "$GITHUB_ENV"
          fi
      # The archive is named after what it contains: the triple a native
      # build was compiled for is read from the compiler, and the binary's
      # own architecture is read from the file. The day a runner label moves,
      # a literal would mislabel the archive instead of failing.
      - name: the binary is for the target it is named after
        run: |
          if [ "${{ matrix.cross }}" != true ]; then
            host="$(rustc -vV | sed -n 's/^host: //p')"
            [ "$host" = "${{ matrix.target }}" ] || { echo "the runner compiles for $host, not ${{ matrix.target }}" >&2; exit 1; }
          fi
          case "${{ matrix.target }}" in
            x86_64-*)  want='x86_64|x86-64' ;;
            aarch64-*) want='aarch64|arm64' ;;
          esac
          file "$BIN" | grep -E -q "$want" || { echo "$(file "$BIN") is not ${{ matrix.target }}" >&2; exit 1; }
      - name: package
        run: bash scripts/package-release.sh "$BIN" "${{ needs.meta.outputs.version }}" "${{ matrix.target }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
