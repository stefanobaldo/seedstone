name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull request run is wasted minutes, and the sweep is the most
# expensive step here. Pushes to `main` are never cancelled: that history is
# the record of what passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--workspace` unifies Cargo features across every crate in the build, so
      # the features the simulator turns on leak into the production crates and
      # hide what they would actually fail to compile on their own.
      - name: production crates compile without simulator features
        run: cargo clippy -p seedstone -p seedstone-core -p seedstone-resp --all-targets -- -D warnings
      - run: cargo test --workspace
      # Linkage, a different axis from the feature unification the step above
      # covers: neither subsumes the other, and both are load-bearing.
      - name: no simulator crate in the production dependency graph
        run: |
          if cargo tree -p seedstone --edges normal,build | grep -q turmoil; then
            echo "turmoil reached the production dependency graph" >&2; exit 1
          fi
      # An allowlist of the irrelevant, not a denylist of the relevant: a path
      # counts as code unless *every* pattern excludes it, so anything nobody
      # anticipated still runs the sweep.
      - name: detect sweep-relevant changes
        uses: dorny/paths-filter@v3
        id: relevant
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'
              - '!docs/**'
      # Pushes to `main` always sweep; a pull request skips only when it
      # touched nothing but prose.
      # Calibrated against this workflow's own first run: 100 seeds took 546 s of
      # sweep on a GitHub runner, 5.5 s per seed, against 2.1 s per seed on the
      # maintainer's machine. That fits the ~10 minute budget with nothing to
      # spare, and runner speed varies. 75 seeds lands near 7 minutes and keeps
      # the headroom. Raising detection power without paying for it in wall clock
      # is a later subphase's problem, not a knob to turn here.
      - name: DST sweep
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: cargo run --release -p seedstone-sim --bin sweep -- --seeds 75 --workload-seed 1
