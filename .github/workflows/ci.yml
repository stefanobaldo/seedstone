name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull request run is wasted minutes, and the sweep is the most
# expensive step here. Pushes to `main` are never cancelled: that history is
# the record of what passed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege, in the tree rather than in a repository setting: a setting is
# invisible to review and does not travel with a fork or a re-clone.
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # The most expensive step measures ~7 minutes. The default of six hours is
    # what a hung simulation would burn before anyone noticed.
    timeout-minutes: 20
    steps:
      # Pinned to commit SHAs, not tags. A tag is a mutable pointer: whoever
      # controls the action's repository can repoint it at code that runs
      # inside this job. The workflow token is read-only, so the realistic
      # damage is not stolen secrets but a gate induced to report green — and
      # a CI that can be made to lie is an attack on this project's central
      # claim, not just on its infrastructure. Dependabot maintains the pins;
      # without it they would simply rot.
      #
      # Every action here runs on Node 24. Node 20 is deprecated on the
      # runners, and an action still declaring it is force-run on 24 anyway —
      # so the choice is between a version tested on the runtime it gets and
      # one that is not. `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION` would only
      # silence that by pinning to the deprecated runtime, which is the
      # opposite of a fix.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `--workspace` unifies Cargo features across every crate in the build, so
      # the features the simulator turns on leak into the production crates and
      # hide what they would actually fail to compile on their own.
      - name: production crates compile without simulator features
        run: cargo clippy -p seedstone -p seedstone-core -p seedstone-resp -p seedstone-service --all-targets -- -D warnings
      - run: cargo test --workspace
      # Linkage, a different axis from the feature unification the step above
      # covers: neither subsumes the other, and both are load-bearing.
      - name: no simulator crate in the production dependency graph
        run: |
          set -euo pipefail
          # Captured rather than piped straight into `grep`: in `if cmd | grep -q
          # x`, only grep's status reaches the `if`, so a failing `cargo tree` —
          # a renamed package, a bad flag, a broken lockfile — makes this step
          # *pass*. A gate that succeeds when its own tooling breaks is not one.
          tree=$(cargo tree -p seedstone --edges normal,build)
          echo "$tree"
          # The positive control. The negative assertion alone is vacuous if the
          # graph is empty: assert first that the production binary really does
          # reach both library crates it is built out of, so a future
          # reorganisation cannot leave the grep below searching nothing.
          for crate in seedstone-core seedstone-service; do
            if ! grep -q "$crate" <<<"$tree"; then
              echo "the production graph does not reach $crate: this gate is asserting nothing" >&2
              exit 1
            fi
          done
          if grep -q turmoil <<<"$tree"; then
            echo "turmoil reached the production dependency graph" >&2
            exit 1
          fi
      # An allowlist of the irrelevant, not a denylist of the relevant: a path
      # counts as code unless *every* pattern excludes it, so anything nobody
      # anticipated still runs the sweep.
      - name: detect sweep-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: relevant
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'
              # Markdown only, deliberately. `!docs/**` would also exclude a
              # tracked `docs/examples/*.rs` the day one appears, and the sweep
              # would stop running for it silently.
              - '!docs/**/*.md'
      # Pushes to `main` always sweep; a pull request skips only when it
      # touched nothing but prose.
      # Recalibrated against this workflow's own runs, now that the sweep runs
      # its seeds in parallel: 75 seeds took 106 s here, 1.41 s per seed against
      # the 5.5 s per seed the same step measured when the sweep was serial —
      # the runner's four cores, spent on the one step that can use them. The
      # budget is unchanged at ~7 minutes with headroom on a 20-minute job, so
      # 420 s buys 296 seeds at that rate; 275 keeps the margin, because the
      # same seeds cost up to 1.47 s each on the nightly workflow's runners and
      # runner speed varies. Detection power past this belongs to the nightly
      # window, which sweeps ten thousand seeds and is not waiting for anyone.
      - name: DST sweep
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: cargo run --release -p seedstone-sim --bin sweep -- --seeds 275 --workload-seed 1

  # Every gate in the job above is this project judging itself: our tests, our
  # simulator, our reading of the protocol. This one is three programs nobody
  # here wrote, connecting the way they connect to Redis and accepting or
  # rejecting the answers on their own terms. It is the only place where being
  # wrong about the protocol shows up as a failure rather than as agreement.
  #
  # A separate job, not more steps above: it needs a Python and a Go toolchain
  # the rest of the workflow has no use for, and its failures are a different
  # kind of news.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same pinning policy as the job above, and the same three actions are
      # pinned to the same SHAs there — see that job's comment for why a tag
      # is not a pin. All five run on Node 24.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # First, so that a pull request touching nothing but prose does not pay
      # for two toolchains and a release build to prove it. The filter itself
      # is duplicated rather than shared: a `paths-filter` output cannot cross
      # a job boundary without making this job depend on that one, which would
      # serialise the two for nothing.
      - name: detect code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: relevant
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'
              - '!docs/**/*.md'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/python/requirements.txt
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        with:
          go-version: '1.23'
          cache-dependency-path: e2e/go/go.sum
      - name: build the server
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: cargo build --release -p seedstone --locked
      # Bounded and retried, for the reason the `perf` job's copy states: an
      # unbounded `apt-get update` on a runner occasionally stops answering
      # rather than failing, and burns the job's whole budget ending red for a
      # reason unrelated to the change under it.
      - name: install the clients
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update -qq && break
            echo "apt-get update did not finish (attempt $attempt)" >&2
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
          # redis-cli and redis-benchmark, without a redis-server nobody asked
          # for: this gate must fail if *our* binary is wrong, and a server
          # installed beside it is a way to accidentally test that one.
          timeout 300 sudo apt-get install -y -qq redis-tools
          pip install -r e2e/python/requirements.txt
      # The script starts and stops its own server; the two steps below start
      # their own, because a suite that inherits a keyspace from the previous
      # one passes for reasons it did not establish.
      - name: redis-cli and redis-benchmark
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: bash e2e/redis-cli.sh target/release/seedstone
      - name: redis-py
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: |
          set -euo pipefail
          target/release/seedstone --bind 127.0.0.1:6390 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 50); do redis-cli -p 6390 ping >/dev/null 2>&1 && break; sleep 0.1; done
          python -m pytest e2e/python -q
      - name: go-redis
        if: github.event_name != 'pull_request' || steps.relevant.outputs.code == 'true'
        run: |
          set -euo pipefail
          target/release/seedstone --bind 127.0.0.1:6390 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 50); do redis-cli -p 6390 ping >/dev/null 2>&1 && break; sleep 0.1; done
          cd e2e/go && go test ./...

  # A performance gate that cannot say what "fast" is, and does not need to.
  # It builds this pull request and the commit it forks from, runs both on the
  # same runner in the same job, and judges the ratio. Absolute throughput on a
  # shared runner is not a number about this server; the ratio between two of
  # its builds, measured minutes apart on one machine, is.
  #
  # The floor is measured, not chosen. This job ran report-only first, on a
  # branch that touches nothing the server does at run time — which makes both
  # arms the same program, and every run of it a comparison of a build against
  # itself. Six of those, in the shape shipped here, landed at 0.9982, 0.9967,
  # 0.9942, 0.9874, 1.0021 and 1.0181 — the widest 1.8% from equality. Three
  # times that distance, which is the rule, would put the floor at 0.94.
  #
  # It sits at 0.93. An earlier and noisier shape of the same cell produced a
  # comparison 4% from equality, so the quiet set above is not the whole tail,
  # and a margin fitted to the calmest evidence available is a gate that fires
  # the first time the runner has a bad minute. The extra point costs almost
  # nothing here: this instrument is for the regression that takes a large
  # fraction of the throughput, and the difference between catching seven
  # percent and catching six is not what it is for.
  #
  # What that buys, plainly: a change costing more than seven percent of the
  # throughput fails here. A three-percent one passes, and a green job is not
  # evidence that none happened — that question belongs to a machine nobody
  # else is sharing.
  perf:
    # A merge-base is the whole premise, and a push to `main` has nothing to
    # compare itself against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same pinning policy as the jobs above. `fetch-depth: 0` because the
      # comparison needs history: the merge-base is not in a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # First, like `e2e`'s: two release builds and a benchmark is a heavy way
      # to prove a prose change did not slow anything down. Same allowlist of
      # the irrelevant, for the reason the `ci` job states.
      - name: detect code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: relevant
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!**/*.md'
              - '!LICENSE*'
              - '!.gitignore'
              - '!docs/**/*.md'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.relevant.outputs.code == 'true'
      # Bounded and retried: `apt-get update` on a runner occasionally stops
      # answering rather than failing, and an unbounded one turns a gate into
      # a twenty-minute hang that ends red for a reason unrelated to the
      # change under it. A gate that fails for its own reasons teaches people
      # to re-run it without reading it.
      - name: install the load generator
        if: steps.relevant.outputs.code == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update -qq && break
            echo "apt-get update did not finish (attempt $attempt)" >&2
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
          timeout 300 sudo apt-get install -y -qq redis-tools
      - name: build this pull request
        if: steps.relevant.outputs.code == 'true'
        run: cargo build --release -p seedstone --locked
      # A worktree rather than a second checkout: same object store, same
      # toolchain, one clone. On a pull request `HEAD` is the merge commit, so
      # the merge-base is the commit on `main` this change would land on — the
      # honest "before" for an "after" that includes the merge.
      - name: build the merge-base
        if: steps.relevant.outputs.code == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin main
          base=$(git merge-base HEAD FETCH_HEAD)
          echo "comparing against $base"
          git -c advice.detachedHead=false worktree add ../base "$base"
          cd ../base && cargo build --release -p seedstone --locked
      - name: ratio gate
        if: steps.relevant.outputs.code == 'true'
        run: bash scripts/perf_gate.sh ../base/target/release/seedstone target/release/seedstone 0.93
