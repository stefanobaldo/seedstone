[package]
name = "seedstone"
version = "0.3.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An in-memory key-value store, written from scratch in Rust. Speaks RESP2 over TCP."
publish = false

[dependencies]
seedstone-core = { path = "../seedstone-core" }
seedstone-resp = { path = "../seedstone-resp" }
seedstone-service = { path = "../seedstone-service" }
# The `net` feature exists here and nowhere else: this crate is the only one
# that touches an operating-system socket, and the CI step asserting that the
# library crates compile without simulator features keeps meaning what it says
# only while their tokio stays netless.
tokio = { workspace = true, features = ["net", "signal", "rt-multi-thread"] }
getrandom.workspace = true
# The binary's global allocator. Profiled with perf (aarch64, glibc 2.39,
# 2026-09-14), glibc's malloc and free — arena locking included — sat under
# 46 to 63 % of the server's CPU samples on five shapes: deep-pipelined GET,
# SET, SET with an expiry, MGET and KEYS; under the same instrument Redis
# 8.10.0 spent 0.02 to 0.28 % in any allocator on the GET, MGET and KEYS
# shapes. This server frees across threads on its request path: a connection
# allocates the command an executor frees, and the executor allocates the
# reply the connection frees. mimalloc keeps per-thread free
# lists and takes a free from another thread without a shared lock.
# Declared here and nowhere else: the library crates and the simulator stay
# on the system allocator, so nothing in the deterministic core depends on it.
mimalloc = "0.1.52"

[lints]
workspace = true

# The Debian and RPM packages: the binary, the unit, the environment file
# as a conffile readable by root alone (it is where the password goes, and
# systemd reads it before the service drops to its user), the licenses and
# the docs. Asset sources are relative to
# this manifest for cargo-deb and to the workspace root for
# cargo-generate-rpm; `target/release/...` is the build output for both.
# A pre-release `-rc.N` becomes `~rc.N` in both, so a candidate sorts before
# its final: `scripts/linux-packages.sh` builds both and says how.
[package.metadata.deb]
maintainer = "Stefano Baldo <stefano@companyhero.com>"
copyright = "Stefano Baldo"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
An in-memory key-value store speaking the Redis protocol (RESP2) over TCP,
with optional on-disk persistence. The service listens on loopback with no
password; /etc/default/seedstone is where a password and further flags go."""
section = "database"
priority = "optional"
depends = "$auto"
# The unit is installed, enabled and started by the maintainer scripts
# cargo-deb generates from Debian's own snippets (deb-systemd-helper): a
# first install enables and starts it, an upgrade restarts it only if it is
# running, a service the administrator disabled stays disabled across
# upgrades and reinstalls, and nothing is started where systemd is not
# running. cargo-deb writes them only when `maintainer-scripts` names a
# directory; it holds no script of its own, only the unit.
maintainer-scripts = "../../packaging/systemd"
systemd-units = { unit-scripts = "../../packaging/systemd", enable = true, start = true, restart-after-upgrade = true }
assets = [
  ["target/release/seedstone", "usr/bin/", "755"],
  ["../../packaging/systemd/seedstone.env", "etc/default/seedstone", "600"],
  ["../../LICENSE-MIT", "usr/share/doc/seedstone/", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/seedstone/", "644"],
  ["../../README.md", "usr/share/doc/seedstone/", "644"],
  ["../../CHANGELOG.md", "usr/share/doc/seedstone/", "644"],
  ["../../docs/install.md", "usr/share/doc/seedstone/", "644"],
  ["../../docs/operations.md", "usr/share/doc/seedstone/", "644"],
]
conf-files = ["/etc/default/seedstone"]

[package.metadata.generate-rpm]
summary = "In-memory key-value store speaking the Redis protocol"
license = "MIT OR Apache-2.0"
assets = [
  { source = "target/release/seedstone", dest = "/usr/bin/seedstone", mode = "755" },
  { source = "packaging/systemd/seedstone.service", dest = "/usr/lib/systemd/system/seedstone.service", mode = "644" },
  { source = "packaging/systemd/seedstone.env", dest = "/etc/sysconfig/seedstone", mode = "600", config = "noreplace" },
  { source = "LICENSE-MIT", dest = "/usr/share/doc/seedstone/LICENSE-MIT", mode = "644", doc = true },
  { source = "LICENSE-APACHE", dest = "/usr/share/doc/seedstone/LICENSE-APACHE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/seedstone/README.md", mode = "644", doc = true },
  { source = "CHANGELOG.md", dest = "/usr/share/doc/seedstone/CHANGELOG.md", mode = "644", doc = true },
  { source = "docs/install.md", dest = "/usr/share/doc/seedstone/install.md", mode = "644", doc = true },
  { source = "docs/operations.md", dest = "/usr/share/doc/seedstone/operations.md", mode = "644", doc = true },
]
# `$1` is how many instances of the package will be installed once the
# transaction is done: 1 in %post is a first install, 0 in %preun is a
# removal, 1 or more in %postun is an upgrade. As the Debian scripts do, the service is enabled and started on
# a first install only, and an upgrade restarts it only if it is running —
# a service the administrator stopped or disabled stays that way.
post_install_script = """
if [ -d /run/systemd/system ]; then
  systemctl daemon-reload || :
  if [ "$1" -eq 1 ]; then systemctl enable --now seedstone.service || :; fi
fi
"""
pre_uninstall_script = """
if [ "$1" -eq 0 ] && [ -d /run/systemd/system ]; then
  systemctl disable --now seedstone.service || :
fi
"""
post_uninstall_script = """
if [ -d /run/systemd/system ]; then
  systemctl daemon-reload || :
  if [ "$1" -ge 1 ]; then systemctl try-restart seedstone.service || :; fi
fi
"""
