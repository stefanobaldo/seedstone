[package]
name = "seedstone-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "SeedStone simulation harness: deterministic testing under turmoil."
publish = false

[dependencies]
seedstone-core.workspace = true
seedstone-resp.workspace = true
seedstone-service.workspace = true
# The codec's bulk payload, which the workload builds its requests from.
bytes.workspace = true
# `unstable-fs` is what makes turmoil's filesystem exist: the simulated log
# is written through it, torn on crash and corrupted on read. Enabled here
# and nowhere else — the production crates never see this feature, which
# the CI step "no simulator crate in the production dependency graph"
# keeps true.
turmoil = { workspace = true, features = ["unstable-fs"] }
rand.workspace = true
tokio.workspace = true

[lints]
workspace = true
