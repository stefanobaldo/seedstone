[package]
name = "seedstone-service"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SeedStone connection layer: RESP2 frames in, core commands out. Netless by construction."
publish = false

[dependencies]
seedstone-core = { path = "../seedstone-core" }
seedstone-resp = { path = "../seedstone-resp" }
# The workspace entry, and deliberately without the `net` feature: the
# simulator drives this crate over a simulated transport, so a socket here
# would put tokio's networking in the deterministic path and unify the feature
# into every build of the workspace.
tokio.workspace = true

[dev-dependencies]
# The paused clock, for the same reason the core declares one: a test that
# holds time still must not be reachable from a production build.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
