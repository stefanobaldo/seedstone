[package]
name = "seedstone-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SeedStone deterministic core: shard runtime, keyspace, log abstraction."
publish = false

[dependencies]
tokio.workspace = true
siphasher.workspace = true

# One arm of a measurement campaign, and nothing an operator should ever
# choose. `no-command-timing` compiles out the per-command clock reading in the
# executor so that what the reading costs can be measured against a build that
# takes it, on the same machine on the same day. It is not a runtime switch and
# it is not a supported configuration: a node built with it reports `usec=0`
# for every command. Removed once the measurement is in hand.
[features]
no-command-timing = []

# `test-util` is what makes `tokio::time` a clock a test can hold still and
# step by hand, which is the only way a deadline is testable without waiting
# for one. Deliberately not a dependency: the paused clock must be unreachable
# from a production build.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
