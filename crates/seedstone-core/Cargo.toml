[package]
name = "seedstone-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SeedStone deterministic core: shard runtime, keyspace, log abstraction."
publish = false

[dependencies]
tokio.workspace = true
siphasher.workspace = true
# A byte string whose clone is a refcount. Values and keys are stored as
# one so a `GET` hands the reply the stored bytes by reference rather than
# by copy; the crate is already in the graph through tokio's `io-util`.
bytes.workspace = true


# `test-util` is what makes `tokio::time` a clock a test can hold still and
# step by hand, which is the only way a deadline is testable without waiting
# for one. Deliberately not a dependency: the paused clock must be unreachable
# from a production build.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
